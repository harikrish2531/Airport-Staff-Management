version: '3.8'

services:
  aeroops-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeroops-management-system
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./airport_ground_staff.db
      - SECRET_KEY=super-secret-capstone-key-2026-airport-ground-staff
    volumes:
      - aeroops-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aeroops-data:
